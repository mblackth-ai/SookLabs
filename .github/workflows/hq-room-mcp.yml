name: HQ room MCP

on:
  push:
    branches: [master]
    paths:
      - "lib/hq/room-mcp*.js"
      - "lib/hq/room-stream-client.js"
      - "lib/hq/dispatch-outcome.js"
      - "lib/hq/join-guide.js"
      - "app/hq/api/room/**"
      - "app/hq/api/client/redeem/**"
      - "middleware.js"
      - "lib/hq/owner-open-paths.js"
      - "lib/hq/owner-open-paths.test.js"
      - "lib/hq/owner-join-errors.js"
      - "lib/hq/owner-redeem.test.js"
      - "lib/hq/owner-portal.js"
      - ".cursor/mcp.json"
      - ".github/workflows/hq-room-mcp.yml"
  pull_request:
    paths:
      - "lib/hq/room-mcp*.js"
      - "lib/hq/room-stream-client.js"
      - "lib/hq/dispatch-outcome.js"
      - "lib/hq/join-guide.js"
      - "app/hq/api/room/**"
      - "app/hq/api/client/redeem/**"
      - "middleware.js"
      - "lib/hq/owner-open-paths.js"
      - "lib/hq/owner-open-paths.test.js"
      - "lib/hq/owner-join-errors.js"
      - "lib/hq/owner-redeem.test.js"
      - "lib/hq/owner-portal.js"
      - ".cursor/mcp.json"
      - ".github/workflows/hq-room-mcp.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: HQ MCP unit tests
        run: |
          node --test \
            lib/hq/room-mcp-probe.test.js \
            lib/hq/room-mcp-rpc.test.js \
            lib/hq/room-stream-client.test.js \
            lib/hq/cursor-mcp-config.test.js \
            lib/hq/room-status.test.js \
            lib/hq/room-public-status.test.js \
            lib/hq/owner-open-paths.test.js \
            lib/hq/owner-redeem.test.js
